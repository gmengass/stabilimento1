name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Placeholder until the stack is scaffolded (ADR 0002).
      # Replace with: install → lint → typecheck → test → build.
      - name: Detect project
        run: |
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          fi
        id: detect

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.node == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install, lint, test, build
        if: steps.detect.outputs.node == 'true'
        run: |
          npm ci
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present
          npm run build --if-present

      - name: No app yet
        if: steps.detect.outputs.node != 'true'
        run: echo "No application code yet. CI passes."
