name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Docs-only pull requests skip the heavy jobs. A skipped job still satisfies a required check.
  # Pushes to main always run everything, and so does a pull request if this job fails.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Does this change touch anything besides docs and agent files?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            # HEAD is the merge commit; its first parent is the base branch.
            files=$(git diff --name-only HEAD^1 HEAD)
            echo "$files"
            docs='^(docs/|\.claude/|\.github/ISSUE_TEMPLATE/|\.github/pull_request_template\.md$|LICENSE$|.*\.md$)'
            other=$(echo "$files" | grep -vE "$docs" || true)
            if [ -n "$files" ] && [ -z "$other" ]; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  checks:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking -d booking_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://booking:booking@localhost:5432/booking_test
      TEST_DATABASE_URL: postgresql://booking:booking@localhost:5432/booking_test
      AUTH_SECRET: ci-only-auth-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: age for the backup script tests
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      - run: npm run lint
      - name: Shellcheck deploy scripts
        run: shellcheck -s sh -x scripts/*.sh scripts/lib/*.sh
      - run: npm run format:check
      - run: npm run typecheck
      - name: Migrate, roll back, migrate again
        run: npm run db:migrate && npm run db:rollback && npm run db:migrate
      - name: Generated DB types match the schema
        run: npm run db:types && git diff --exit-code src/db/types.ts
      - run: npm test
      - run: npm run build

  e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking -d booking"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://booking:booking@localhost:5432/booking
      APP_DATABASE_URL: postgresql://booking_app:ci0only0app0password0123@localhost:5432/booking
      AUTH_SECRET: ci-only-auth-secret-0123456789abcdef
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Migrate and seed as the owner (also creates the app's account, ADR 0028)
        run: npm run db:migrate && npm run db:seed-admin
      - name: End-to-end tests with the app on its own account, as on the box
        run: npm run test:e2e
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      APP_DATABASE_URL: postgresql://booking_app:ci0only0app0password0123@db:5432/booking
      AUTH_SECRET: ci-only-auth-secret-0123456789abcdef
      ADMIN_USERNAME: ci_admin
      ADMIN_PASSWORD: ci-only-admin-password
      APP_URL: https://localhost
      SITE_ADDRESS: localhost, 127.0.0.1
      DEFAULT_SNI: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate compose file and Caddyfile
        run: |
          docker compose config -q
          # Without APP_DATABASE_URL (a box mid-update, a dev .env) the app keeps the owner account.
          env -u APP_DATABASE_URL docker compose config --format json |
            jq -er '.services.app.environment.DATABASE_URL | startswith("postgresql://booking:")'
          docker compose config --format json |
            jq -er '.services.app.environment.DATABASE_URL | startswith("postgresql://booking_app:")'
          docker compose run --rm --no-deps --entrypoint caddy caddy validate --config /etc/caddy/Caddyfile
      - name: Build images
        run: |
          # Like a box checkout made under umask 077: sources readable by their owner only.
          chmod -R go-rwx src tsconfig.json
          docker compose build
      - name: Migrate
        run: docker compose run --rm migrate
      - name: Create the first admin twice (idempotent)
        run: docker compose run --rm seed-admin && docker compose run --rm seed-admin
      - name: Start app and Caddy
        run: docker compose up -d --no-deps --wait app caddy
      - name: Trust Caddy's internal root certificate
        run: |
          for i in $(seq 1 30); do
            docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt caddy-root.crt && break
            sleep 1
          done
          test -s caddy-root.crt
      - name: Health check over HTTPS
        # Caddy issues the localhost and 127.0.0.1 certificates at the same moment; when saving
        # one loses that race it tries again after 60 s. Wait 90 s so a lost race does not fail CI.
        run: |
          body=$(curl -fsS --retry 90 --retry-all-errors --retry-delay 1 --cacert caddy-root.crt https://localhost/health)
          echo "$body"
          test "$body" = '{"status":"ok","db":"ok"}'
      - name: HTTPS by IP (no server name) gets the IP's certificate (DEFAULT_SNI)
        run: |
          body=$(curl -fsS --retry 90 --retry-all-errors --retry-delay 1 --cacert caddy-root.crt https://127.0.0.1/health)
          test "$body" = '{"status":"ok","db":"ok"}'
      - name: Security headers, including the app's Content-Security-Policy through Caddy
        run: |
          headers=$(curl -fsS -D - -o /dev/null --cacert caddy-root.crt https://localhost/login)
          echo "$headers"
          echo "$headers" | grep -qi "^content-security-policy: default-src 'self';.*frame-ancestors 'none'"
          echo "$headers" | grep -qi '^x-frame-options: DENY'
      - name: The app uses its own account, which is not a superuser (ADR 0028)
        run: |
          # The health check above already passed through this account.
          docker compose exec -T app printenv DATABASE_URL | grep -q '^postgresql://booking_app:'
          q() { docker compose exec -T db psql -U booking -d booking -tAc "$1"; }
          test "$(q "select rolsuper or rolcreaterole or rolcreatedb from pg_roles where rolname = 'booking_app'")" = f
      - name: Containers are hardened
        run: |
          for service in app caddy; do
            id=$(docker compose ps -q "$service")
            docker inspect -f '{{.HostConfig.SecurityOpt}} {{.HostConfig.CapDrop}}' "$id" | tee /dev/stderr |
              grep -q 'no-new-privileges:true.*ALL'
          done
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$(docker compose ps -q app)")" = true
      - name: App port is not published on the host
        run: "! curl -s --max-time 3 http://localhost:3000/health"
      - name: Caddy overwrites client IP headers (spoofed headers still hit the rate limit)
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --cacert caddy-root.crt \
              -H 'content-type: application/json' -H 'origin: https://localhost' \
              -H "x-forwarded-for: 203.0.113.$i" -H "x-real-ip: 203.0.113.$i" \
              -d '{"username":"nobody","password":"wrong-password-1"}' \
              https://localhost/api/auth/sign-in/username)
            echo "attempt $i: $code"
          done
          test "$code" = 429
      - name: Roll back the migration in the container
        run: docker compose run --rm migrate down | tee /dev/stderr | grep -Eq "Success down [0-9]{4}_"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v

  # The Android app (ADR 0010), built by the box's own script with a throwaway root and key.
  android:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Key and APK directories outside the checkout
        run: |
          echo "ANDROID_KEY_DIR=$RUNNER_TEMP/secrets" >> "$GITHUB_ENV"
          echo "ANDROID_OUT_DIR=$RUNNER_TEMP/apk" >> "$GITHUB_ENV"
      - name: The wrapper trusts the club root only (ADR 0028)
        run: |
          config=android/app/src/main/res/xml/network_security_config.xml
          grep -q 'src="@raw/club_root"' "$config"
          ! grep -q 'src="system"\|src="user"' "$config"
      - name: No JavaScript bridge or file access in the wrapper
        run: "! grep -rnE 'addJavascriptInterface|setAllowFileAccess\\(true|allowFileAccess = true|onReceivedSslError.*proceed|handler\\.proceed' android/"
      - name: Throwaway club root in a caddy_data volume, box-like .env
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=CI throwaway root" \
            -keyout "$RUNNER_TEMP/ca.key" -out "$RUNNER_TEMP/root.crt"
          docker volume create stabilimento_caddy_data
          docker run --rm -v stabilimento_caddy_data:/d -v "$RUNNER_TEMP/root.crt:/root.crt:ro" caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            sh -c 'mkdir -p /d/caddy/pki/authorities/local && cp /root.crt /d/caddy/pki/authorities/local/root.crt'
          {
            echo "APP_URL=https://stabilimento.local"
            echo "SITE_ADDRESS=stabilimento.local, 192.168.0.10, stabilimento.tail1234.ts.net"
            echo "TRUSTED_ORIGINS=https://192.168.0.10,https://stabilimento.tail1234.ts.net"
            echo "REMOTE_URL=https://stabilimento.tail1234.ts.net"
          } > .env
          cp .env "$RUNNER_TEMP/good.env"
      - name: Bad settings are refused before anything is built
        run: |
          refuse() {
            cp "$RUNNER_TEMP/good.env" .env
            printf '%s\n' "$1" >> .env
            if scripts/build-android.sh 2> err; then echo "accepted: $1"; exit 1; fi
            grep -F "$2" err
          }
          refuse "APP_URL=http://stabilimento.local" "APP_URL must be an https origin"
          refuse "TRUSTED_ORIGINS=https://192.168.0.10/,https://stabilimento.tail1234.ts.net" "is not an https origin"
          refuse "REMOTE_URL=https://other.tail1234.ts.net" "must also be in TRUSTED_ORIGINS"
          refuse "TRUSTED_ORIGINS=https://192.168.0.99,https://stabilimento.tail1234.ts.net" "192.168.0.99 is not in SITE_ADDRESS"
          cp "$RUNNER_TEMP/good.env" .env
          if CADDY_VOLUME=ci_empty_caddy_data scripts/build-android.sh 2> err; then exit 1; fi
          grep -F "no Caddy root certificate" err
          docker volume rm ci_empty_caddy_data
          test ! -e "$ANDROID_OUT_DIR"
      - name: Build twice with the same key
        run: |
          scripts/build-android.sh
          scripts/build-android.sh
          ls -l "$ANDROID_OUT_DIR" "$ANDROID_KEY_DIR"
          test "$(find "$ANDROID_OUT_DIR" -name '*.apk' | wc -l)" = 2
          test "$(stat -c %a "$ANDROID_KEY_DIR/stabilimento-android.p12")" = 600
          test "$(stat -c %a "$ANDROID_KEY_DIR/stabilimento-android.pass")" = 600
      - name: Same signer, growing version, minimum Android 7.0, INTERNET only, club root bundled
        run: |
          image=$(docker image ls stabilimento-android-build --format '{{.Repository}}:{{.Tag}}' | head -n 1)
          docker run --rm -v "$ANDROID_OUT_DIR:/apk:ro" -v "$RUNNER_TEMP/root.crt:/root.crt:ro" "$image" sh -euc '
            set -- /apk/*.apk
            signer() { apksigner verify --print-certs "$1" | sed -n "s/^Signer #1 certificate SHA-256 digest: //p"; }
            code() { aapt2 dump badging "$1" | sed -n "s/^package: .* versionCode=.\([0-9]*\).*/\1/p"; }
            test -n "$(signer "$1")" && test "$(signer "$1")" = "$(signer "$2")"
            echo "versionCode $(code "$1") -> $(code "$2")"
            test "$(code "$2")" -gt "$(code "$1")"
            aapt2 dump badging "$2" > /tmp/badging
            grep -E "^(package|(min|target)?[sS]dkVersion):" /tmp/badging
            grep -Eqx "(min|)[sS]dkVersion:.24." /tmp/badging
            grep "^uses-permission:" /tmp/badging
            test "$(grep -c "^uses-permission:" /tmp/badging)" = 1
            grep -Fq "uses-permission: name='"'"'android.permission.INTERNET'"'"'" /tmp/badging
            mkdir /tmp/x && cd /tmp/x && unzip -q "$2"
            find . -type f -exec cmp -s /root.crt {} \; -print | grep .
          '
      - name: The checkout is untouched
        run: |
          rm .env err
          git status --porcelain
          test -z "$(git status --porcelain)"

  deploy-scripts:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Box-like .env and two local release tags
        run: |
          {
            echo "POSTGRES_PASSWORD=ci0only0password"
            echo "AUTH_SECRET=ci-only-auth-secret-0123456789abcdef"
            echo "APP_URL=https://localhost"
            echo "SITE_ADDRESS=localhost"
          } > .env
          git tag v0.0.1 && git tag v0.0.2
      - name: First install v0.0.1
        run: scripts/update.sh v0.0.1
      - name: Data entered on v0.0.1
        run: |
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1' <<'SQL'
          create table deploy_marker (label text);
          insert into deploy_marker values ('before-update');
          SQL
      - name: Update to v0.0.2 (takes the pre-update dump)
        run: scripts/update.sh v0.0.2 && test "$(cat .deploy/current)" = v0.0.2
      - name: Data entered on v0.0.2
        run: |
          docker compose exec -T db sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "insert into deploy_marker values ('"'"'after-update'"'"')"'
      - name: Roll back to v0.0.1 and its dump
        run: scripts/rollback.sh --yes && test "$(cat .deploy/current)" = v0.0.1
      - name: Restored data is the pre-update state, app healthy over HTTPS
        run: |
          rows=$(docker compose exec -T db sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select label from deploy_marker order by label"')
          echo "rows: $rows"
          test "$rows" = before-update
          test "$(curl -fsSk https://localhost/health)" = '{"status":"ok","db":"ok"}'
      - name: Backup tools, a throwaway key, a local folder standing in for OneDrive
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q age rclone
          age-keygen -o "$RUNNER_TEMP/key" 2>/dev/null
          {
            echo "BACKUP_AGE_RECIPIENTS=$(age-keygen -y "$RUNNER_TEMP/key")"
            echo "BACKUP_RCLONE_REMOTE=:local:$RUNNER_TEMP/onedrive"
          } >> .env
      - name: Nightly backup, encrypted, on the box and the remote
        run: |
          scripts/backup.sh
          file=$(ls backups/nightly)
          cmp "backups/nightly/$file" "$RUNNER_TEMP/onedrive/$file"
          head -c 21 "backups/nightly/$file" | grep -q '^age-encryption.org/v1'
      - name: Monthly restore test with the secret key
        run: grep AGE-SECRET-KEY "$RUNNER_TEMP/key" | scripts/restore-backup.sh --test latest
      - name: New box - the whole database restored from the remote
        run: |
          docker compose exec -T db sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "delete from deploy_marker"'
          rm -rf backups/nightly
          grep AGE-SECRET-KEY "$RUNNER_TEMP/key" | scripts/restore-backup.sh --yes latest
          rows=$(docker compose exec -T db sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select label from deploy_marker"')
          test "$rows" = before-update
          test "$(curl -fsSk https://localhost/health)" = '{"status":"ok","db":"ok"}'
      - name: Systemd units are valid
        run: |
          mkdir "$RUNNER_TEMP/units"
          scripts/install-backup-timer.sh --render "$RUNNER_TEMP/units"
          systemd-analyze verify "$RUNNER_TEMP/units/stabilimento-backup.timer"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v
