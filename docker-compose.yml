# Local / server stack: PostgreSQL, a one-shot migration job, the app, and Caddy (HTTPS) in front.
# Images are tagged with APP_VERSION, set by scripts/update.sh (ADR 0008).
name: stabilimento

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrate }
    image: stabilimento-migrate:${APP_VERSION:-dev}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-booking}
    depends_on:
      db: { condition: service_healthy }

  # First admin account: `docker compose run --rm seed-admin` (no-op if it already exists).
  seed-admin:
    profiles: [setup]
    build: { context: ., target: migrate }
    image: stabilimento-migrate:${APP_VERSION:-dev}
    entrypoint: ["node", "--import", "tsx", "src/db/seed-admin.ts"]
    command: []
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-booking}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db: { condition: service_healthy }

  app:
    build: { context: ., target: runner }
    image: stabilimento-app:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-booking}
      APP_URL: ${APP_URL:?set APP_URL in .env}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
    # No host port: clients must come through Caddy, which sets X-Real-IP for the login rate
    # limit (ADR 0008).
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Holds the internal CA root key: back it up and move it with the database (ADR 0008).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
